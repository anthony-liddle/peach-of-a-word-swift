# XcodeGen spec for the minimal SwiftUI app.
#
# This file exists because there is no way to create an iOS app target from the
# terminal with stock tooling. SwiftPM builds libraries, executables and tests,
# but it cannot produce an app bundle, and there is no `xcodebuild -create`.
# So an app means an .xcodeproj, and an .xcodeproj means either hand-writing
# pbxproj or generating it. That is a finding, not a footnote. See
# docs/REPORT.md, question 4.
#
# Regenerate with: xcodegen generate
# The generated .xcodeproj is committed too, so the repo opens without xcodegen.

name: PeachOfAWord
options:
  # The bundle identifier is `com.anthonyliddle.peachofaword`, set explicitly
  # below rather than composed from a prefix plus the target name.
  #
  # It was `com.anthonyliddle.peachofaword.PeachMinimal`, which carried a
  # scaffold name into a permanent identity. Changing it AFTER an install makes
  # iOS treat the app as a different one: the existing copy stays, orphaned,
  # with its saved progress unreachable. Free to change today, and expensive the
  # moment there is a streak worth keeping, so it is being settled now.
  bundleIdPrefix: com.anthonyliddle
  # iOS 17 is the floor for this app: @Observable and ContentUnavailableView are
  # both iOS 17, and nothing here needs anything newer. It was briefly 26.0,
  # which only InlineArray in PeachEngine required. See docs/MEASUREMENTS.md.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PeachEngine:
    path: .

targets:
  PeachOfAWord:
    type: application
    platform: iOS
    sources:
      - path: App
      # A folder reference, so the word lists keep their directory structure
      # inside the bundle and land at Bundle.main.resourceURL/Data/.
      - path: Data
        type: folder
        buildPhase: resources
      - path: App/Assets.xcassets
    dependencies:
      - package: PeachEngine
        product: PeachEngine
    info:
      path: App/Info.plist
      properties:
        # What the home screen shows. The target is PeachOfAWord for tooling;
        # the human-facing name has the spaces.
        CFBundleDisplayName: Peach of a Word
        UILaunchScreen: {}
        # Declared here so App Store Connect stops asking on every single build.
        # Without it, each upload sits in "Missing Compliance" until the export
        # questionnaire is answered by hand, which is a per-build tax rather
        # than a one-off.
        #
        # False is the honest answer, not a shortcut. The app makes no network
        # calls at all: the word lists ship in the bundle, progress lives in
        # UserDefaults, and the only cryptography anywhere near it is whatever
        # the OS does underneath, which is exempt by definition.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Bundled fonts must be declared here or they are copied into the app
        # and silently never registered. Both are variable fonts carrying named
        # instances (Fredoka-SemiBold, Nunito-SemiBold and so on), which is what
        # Font.custom looks up by PostScript name.
        UIAppFonts:
          - Fredoka.ttf
          - Nunito.ttf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: PeachOfAWord
        PRODUCT_BUNDLE_IDENTIFIER: com.anthonyliddle.peachofaword
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        # Build number, not version. App Store Connect permanently reserves
        # every value it has accepted, so this has to rise before each upload
        # even when nothing else changed. MARKETING_VERSION is the human one
        # and only moves when the release does.
        #
        # 1 was uploaded on 2026-08-09, before ITSAppUsesNonExemptEncryption
        # existed, so that build asks the export compliance question by hand.
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Signing lives here rather than in Xcode's UI, because this project is
        # generated: anything set through Xcode's project settings is discarded
        # the next time `xcodegen generate` runs. Source edits under App/ and
        # Sources/ are safe; project settings are not.
        #
        # This was briefly CODE_SIGNING_ALLOWED: NO, which is fine for the
        # simulator and blocks running on a real device.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9ML46U556H
