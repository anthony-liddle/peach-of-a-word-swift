# XcodeGen spec for the minimal SwiftUI app.
#
# This file exists because there is no way to create an iOS app target from the
# terminal with stock tooling. SwiftPM builds libraries, executables and tests,
# but it cannot produce an app bundle, and there is no `xcodebuild -create`.
# So an app means an .xcodeproj, and an .xcodeproj means either hand-writing
# pbxproj or generating it. That is a finding, not a footnote. See
# docs/REPORT.md, question 4.
#
# Generate with: xcodegen generate
#
# This file is the only source of truth for the project. The .xcodeproj is NOT
# committed, so a fresh clone has no project until that command is run, and
# ci_scripts/ci_post_clone.sh runs it on every Xcode Cloud build.
#
# It was committed for a while, so the repo would open without XcodeGen. That
# made this file and the generated project two descriptions of the same thing,
# with nothing to stop them disagreeing.

name: PeachOfAWord
options:
  # The bundle identifier is `com.anthonyliddle.peachofaword`, set explicitly
  # below rather than composed from a prefix plus the target name.
  #
  # It was `com.anthonyliddle.peachofaword.PeachMinimal`, which carried a
  # scaffold name into a permanent identity. Changing it AFTER an install makes
  # iOS treat the app as a different one: the existing copy stays, orphaned,
  # with its saved progress unreachable. Free to change today, and expensive the
  # moment there is a streak worth keeping, so it is being settled now.
  bundleIdPrefix: com.anthonyliddle
  # iOS 17 is the floor for this app: @Observable and ContentUnavailableView are
  # both iOS 17, and nothing here needs anything newer. It was briefly 26.0,
  # which only InlineArray in PeachEngine required. See docs/MEASUREMENTS.md.
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PeachEngine:
    path: .

targets:
  PeachOfAWord:
    type: application
    platform: iOS
    sources:
      - path: App
      # A folder reference, so the word lists keep their directory structure
      # inside the bundle and land at Bundle.main.resourceURL/Data/.
      - path: Data
        type: folder
        buildPhase: resources
      - path: App/Assets.xcassets
    dependencies:
      - package: PeachEngine
        product: PeachEngine
    info:
      path: App/Info.plist
      properties:
        # What the home screen shows. The target is PeachOfAWord for tooling;
        # the human-facing name has the spaces.
        CFBundleDisplayName: Peach of a Word
        UILaunchScreen: {}
        # Point the plist at the build settings rather than repeating their
        # values. XcodeGen writes literal defaults for both of these, so the
        # settings below and the bundle drift apart silently: bumping
        # CURRENT_PROJECT_VERSION alone left CFBundleVersion at 1, and the
        # first upload of a "new" build would have been rejected as a
        # duplicate with nothing in the project to explain why. They agreed
        # up to now only because both happened to read 1.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        # Declared here so App Store Connect stops asking on every single build.
        # Without it, each upload sits in "Missing Compliance" until the export
        # questionnaire is answered by hand, which is a per-build tax rather
        # than a one-off.
        #
        # False is the honest answer, not a shortcut. The app makes no network
        # calls at all: the word lists ship in the bundle, progress lives in
        # UserDefaults, and the only cryptography anywhere near it is whatever
        # the OS does underneath, which is exempt by definition.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Bundled fonts must be declared here or they are copied into the app
        # and silently never registered. Both are variable fonts carrying named
        # instances (Fredoka-SemiBold, Nunito-SemiBold and so on), which is what
        # Font.custom looks up by PostScript name.
        UIAppFonts:
          - Fredoka.ttf
          - Nunito.ttf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: PeachOfAWord
        PRODUCT_BUNDLE_IDENTIFIER: com.anthonyliddle.peachofaword
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        # Build number, not version. App Store Connect permanently reserves
        # every value it has accepted, so this has to rise before each upload
        # even when nothing else changed. MARKETING_VERSION is the human one
        # and only moves when the release does.
        #
        # 1 was uploaded on 2026-08-09, before ITSAppUsesNonExemptEncryption
        # existed, so that build asks the export compliance question by hand.
        #
        # 3 is the first build carrying the reveal card's content. 2 was never
        # distributed: a release hold ran from the day the card's machine landed
        # to the day its corpus did, because in between the card had lost the
        # points block that used to fill it and gained nothing to replace it.
        # Shipping the machine ahead of the content was deliberate; shipping a
        # build during the gap would not have been.
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Signing lives here rather than in Xcode's UI, because this project is
        # generated: anything set through Xcode's project settings is discarded
        # the next time `xcodegen generate` runs. Source edits under App/ and
        # Sources/ are safe; project settings are not.
        #
        # This was briefly CODE_SIGNING_ALLOWED: NO, which is fine for the
        # simulator and blocks running on a real device.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9ML46U556H
    # Attach the package's test bundle to this target's scheme.
    #
    # Without this, `xcodebuild test -scheme PeachOfAWord` has nothing to run
    # and Xcode Cloud's Test action fails with "no test bundles available to
    # test". That failure stops the whole workflow, so the Archive that
    # succeeded alongside it never gets distributed and no build reaches
    # TestFlight.
    scheme:
      testTargets:
        - PeachOfAWordTests
      gatherCoverageData: false

  # The engine suite, as an Xcode test bundle.
  #
  # The same files `swift test` runs, compiled a second way rather than copied.
  # They live in the SwiftPM package, which the app target has no reason to know
  # about, so GitHub Actions found them (`swift test`) and Xcode Cloud did not
  # (`xcodebuild test` against a scheme with no testables). Two pipelines, two
  # different answers to "are the tests passing", and the one that builds the
  # archive was the one answering wrongly.
  #
  # Duplicating the run costs a couple of minutes of the monthly compute budget.
  # A pipeline that archives untested code is worse than one that checks twice.
  #
  # A logic test bundle with no host application: nothing here launches the app
  # or touches UIKit. `AppVocabularyTests` reads `App/*.swift` as text and the
  # engine tests read `Data/` from `repositoryRoot`, both resolved from
  # `#filePath` at compile time. That works under the simulator, which shares the
  # build machine's filesystem, and would not on a device. These never run on a
  # device.
  PeachOfAWordTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PeachEngineTests
      # The three things the suite reads off disk, carried in the bundle.
      #
      # `swift test` runs from the source tree and finds them there. Xcode
      # Cloud's test phase does not have the checkout that `#filePath` points
      # at, so the first attempt failed 14 tests against paths under
      # /Volumes/workspace/repository that had existed during the build an hour
      # earlier. Copying them in is what makes the suite portable rather than
      # source-tree bound. Folder references, so the directory names survive and
      # the fallbacks can look for `Data/` and `App/` by name.
      - path: Data
        type: folder
        buildPhase: resources
      - path: App
        type: folder
        buildPhase: resources
      - path: Fixtures/oracle.json
        buildPhase: resources
    dependencies:
      - package: PeachEngine
        product: PeachEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.anthonyliddle.peachofaword.tests
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9ML46U556H

  # UI tests, which exist because four separate questions could not be answered
  # any other way.
  #
  # Previews, typing into the simulator, tapping a tile, and scrolling a view
  # were each worked around with a launch argument. Launch arguments can put the
  # app into a state; they cannot perform a gesture, and the remaining questions
  # on the accessibility path are all gestures. This is the instrument that
  # should have existed after the second workaround.
  #
  # Not in the app scheme's testTargets. `xcodebuild test` and Xcode Cloud
  # therefore do not run these, which is deliberate for now: the delivery
  # pipeline took three pull requests to get green and a flaky UI test is the
  # classic way to lose it again. Run them explicitly:
  #
  #   xcodebuild test -scheme PeachOfAWord -only-testing:PeachOfAWordUITests \
  #     -destination 'platform=iOS Simulator,name=iPhone 15'
  PeachOfAWordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PeachOfAWord
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.anthonyliddle.peachofaword.uitests
        TEST_TARGET_NAME: PeachOfAWord
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9ML46U556H
    # Its own scheme, so these can be run without putting them in the app
    # scheme, which is what Xcode Cloud and GitHub Actions test.
    scheme:
      testTargets:
        - PeachOfAWordUITests
