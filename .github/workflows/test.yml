name: test

# Xcode Cloud already builds and delivers main to TestFlight. This is the other
# half: it runs on pull requests, before anything reaches main, and it runs the
# engine suite, which Xcode Cloud does not.
on:
  push:
    branches: [main]
  pull_request:
    # TEMPORARY, for the throwaway pull requests that show which UI tests a
    # change runs: they target this branch, so their diff is theirs alone.
    # Removed before this merges.
    branches: [main, ci/faster-ui-tests]
    # The defaults, plus a label going on or coming off, so `full-ui` takes
    # effect without a push. Any label change restarts the run, through the
    # concurrency group below, and the new run does all the work again: a
    # label run that skipped its jobs would report those checks as skipped,
    # which branch protection counts as passed, over the real run's result.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A second push to a PR makes the first run pointless. macOS runners are the
# expensive kind, so cancel rather than queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What this run tests, decided before anything waits on a simulator.
  #
  # **The UI suite is split into shards by a committed map,**
  # `.github/ui-tests/shards.txt`, and this checks it first: every UI test
  # class in exactly one shard, and no shard naming a class that is gone. A new
  # test class with no line in the map fails here, in seconds, rather than
  # silently never running.
  #
  # **A change that touches only data runs a targeted set.** A pull request
  # whose files are all under Data/, TestFlight/, docs/ or tools/, or are
  # Markdown, runs the UI classes in `.github/ui-tests/data-only.txt`: the ones
  # whose results read the calendar, the word lists, the definitions or the
  # other files in Data/. Everything else runs the whole suite: any other
  # file, a push to main, or the `full-ui` label on the pull request.
  #
  # On Ubuntu, because deciding needs no Xcode, and the free plan's five
  # concurrent macOS jobs are the scarce thing here, shared by every run on the
  # account.
  plan:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.choose.outputs.scope }}
      why: ${{ steps.choose.outputs.why }}
      tests: ${{ steps.choose.outputs.tests }}
      shards: ${{ steps.choose.outputs.shards }}

    steps:
      # A pull request checks out its merge with the base branch, whose first
      # parent is the base: those two commits are all the diff below needs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Every UI test class in exactly one shard
        run: python3 .github/ui-tests/plan.py check

      # `--no-renames`, so a file moved out of App/ into Data/ lists both
      # paths, and the move counts as the code change it is.
      - name: What this change runs
        id: choose
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          CHANGED="$RUNNER_TEMP/changed.txt"
          : > "$CHANGED"
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > "$CHANGED"
            echo "$(wc -l < "$CHANGED" | tr -d ' ') files changed"
          fi
          python3 .github/ui-tests/plan.py choose "$CHANGED" >> "$GITHUB_OUTPUT"

  test:
    # macOS, because building an iOS app needs Xcode. Pinned rather than
    # macos-latest: a runner image rolling forward to a new major Xcode is a
    # change to what this repo is tested against, and it should be a commit.
    #
    # 26 because that is what actually ships this app: it matches Xcode Cloud
    # and the machine it is developed on, so a green run here means the thing
    # that reaches TestFlight compiles. The older SDK is covered by
    # build-oldest-sdk below, which is a different question.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Versions
        run: |
          swift --version
          xcodebuild -version

      # The word lists in Data/ are a committed copy of an orchard release,
      # which is what keeps builds offline and off the compute-hour budget. The
      # cost of a committed copy is that it can drift from the release it claims
      # to be, so the claim gets checked. Offline and no network: it hashes the
      # committed files against the pins in the script.
      #
      # This ran nowhere before, and the gap it closes is documented: meta.json
      # described a build that no longer shipped for six weeks, and the numbers
      # reached a published essay.
      - name: Lexicon drift check
        run: tools/update-lexicon.sh --check

      # The same for the game's sounds: Data/peach.cues.json against the web
      # commit and SHA-256 it is pinned to, and Package.resolved still pinning
      # the Soundscape version the file was checked against. Offline.
      - name: Cue file drift check
        run: tools/update-cues.sh --check

      # The engine suite. Pure Swift, no Xcode project involved, which is why
      # it runs before the project is generated: a failure here is a real
      # failure rather than a generation problem.
      - name: swift test
        run: swift test

      # The same suite in the configuration that ships, which is the only way
      # this stays true. It stopped building at all when an engine function was
      # gated behind `#if DEBUG` while a test still called it, and nothing
      # caught it, because nothing ran this. Release is also where the
      # optimiser can change behaviour the Debug run never sees.
      - name: swift test, release configuration
        run: swift test -c release

      # Generates PeachOfAWord.xcodeproj, which is not committed.
      #
      # Deliberately the same script Xcode Cloud runs, rather than a second
      # copy of the same steps. It pins and checksums XcodeGen, and calling it
      # here means every pull request exercises the script that delivers to
      # TestFlight. CI_BUILD_NUMBER is unset, so it leaves the build number
      # alone exactly as a local run does.
      - name: Generate the Xcode project
        run: ./ci_scripts/ci_post_clone.sh

      # A simulator destination, so no signing is involved. Signing on a fork's
      # pull request could not work anyway, and this is checking that the app
      # compiles, not that it can be shipped. Xcode Cloud covers the signed
      # device build.
      #
      # **Automatic package resolution is off, in every job here, because it
      # is off on Xcode Cloud.** Cloud builds from the committed
      # Package.resolved and nothing else. Left on, xcodebuild would quietly
      # resolve a missing or stale pin and every check would pass, while the
      # build that delivers to TestFlight failed. Off, a pull request fails the
      # way Cloud would. The packages land in a known place so the step below
      # can read them.
      - name: Build the app
        run: |
          xcodebuild \
            -project PeachOfAWord.xcodeproj \
            -scheme PeachOfAWord \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
            build

      # The licence texts the app carries for Soundscape, against the package
      # the build just resolved, byte for byte. A unit test pins their hashes
      # at 0.2.1 and runs everywhere, Xcode Cloud included; this is what ties
      # them to whatever Package.resolved actually pins, so moving the package
      # without taking its licences fails here.
      #
      # The cue file too, against the package's conformance copy: the document
      # the player's renders are held to the browsers on. The app's copy has to
      # be that document, or it plays sounds nobody compared.
      - name: Soundscape's files, against the resolved package
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/packages/checkouts/soundscape"
          cmp Data/Soundscape-LICENSE.txt "$PKG/LICENSE"
          cmp Data/Soundscape-LICENSE-CHROMIUM.txt "$PKG/LICENSE-CHROMIUM"
          cmp Data/peach.cues.json "$PKG/conformance/cues/cases/peach-of-a-word.json"
          echo "licences and cue file match $(git -C "$PKG" describe --tags --exact-match 2>/dev/null || git -C "$PKG" rev-parse HEAD)"

  # The unit tests, run the way Xcode Cloud runs them: without the checkout.
  #
  # **This job exists because six builds failed and nobody was told.** A test
  # read `Data/daily-calendar.json` through a path built from `#filePath`, with
  # `try!`. That resolves under `swift test`, which runs from the checkout, and
  # in Xcode locally. Xcode Cloud runs the test bundle with no checkout at all,
  # so the read threw, the `try!` trapped, and the whole xctest process died.
  # The Archive action kept succeeding, the Test action kept failing, and the
  # TestFlight post-action never ran. Builds 14 through 19 went nowhere.
  #
  # **The `test` job above cannot catch that class, by construction.** It runs
  # `swift test`, which executes from the source tree, so a source-tree path is
  # always correct there. Every check was honestly green about a thing that was
  # broken where it ships.
  #
  # The condition is reproduced rather than approximated: build the test bundle,
  # then move the directories tests read out of the way, then run the built
  # bundle. `#filePath` is baked at compile time, so after the move it points at
  # nothing, which is exactly what Cloud presents. Tests that read the source
  # tree crash or fail here; tests that use the bundled copies pass.
  #
  # `project.yml` copies `Data`, `App` and the oracle fixture into the test
  # bundle as resources so the fallbacks have somewhere to look. This job is what
  # keeps that true: without it, the copies stay committed and nothing notices
  # when a new test stops using them.
  #
  # **Removing the failure mode beats detecting it.** This would have failed on
  # the pull request that introduced the trap, rather than six builds later, and
  # it is the only check here that runs what Cloud runs.
  checkout-less-tests:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Versions
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: ./ci_scripts/ci_post_clone.sh

      # Built while the checkout is intact, and into a derived data path outside
      # the repository, so removing the checkout below cannot take the products
      # with it.
      - name: Build the test bundle
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project PeachOfAWord.xcodeproj \
            -scheme PeachOfAWord \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$RUNNER_TEMP/dd"

      # The whole point. Every directory a test reads from the source tree goes
      # away: Data for the word lists and the calendar, App for the vocabulary
      # scanner, Fixtures for the oracle. What remains is the bundle.
      - name: Remove the checkout the tests point at
        run: |
          set -euo pipefail
          for dir in Data App Fixtures; do
            if [ -d "$dir" ]; then
              mv "$dir" "$RUNNER_TEMP/moved-$dir"
              echo "moved $dir aside"
            fi
          done

      - name: Unit tests with no checkout present
        run: |
          set -euo pipefail
          XCTESTRUN=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)
          echo "using $XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination 'platform=iOS Simulator,name=iPhone 17'

  # The UI tests, built once for every job that runs them.
  #
  # They are the only instrument that can perform a gesture, and they earned
  # their place three times in one session: they settled whether the touch-down
  # commit conflicts with the scroll pan, produced the layout budget that killed
  # a design premise, and detect which layout was chosen structurally rather
  # than by a height threshold a squeeze could fool.
  #
  # Deliberately separate jobs rather than folded into `test`. If they turn out
  # to be flaky on a runner they fail on their own, and the check that gates
  # merging and the check that gates delivery stay unaffected. That also means
  # `ui-tests` is NOT a required status check until it has a track record,
  # which is a decision to revisit rather than a permanent state.
  #
  # **Built here, run in shards below.** One job on one simulator ran them all
  # in sequence, 55 to 85 minutes a run in the week to 29 October 2026. Each
  # shard downloads this build and runs `test-without-building`, so the suite
  # compiles once however many simulators run it.
  #
  # Built for the runner's own iPhone simulator, by UDID, which every shard's
  # runner also has: the image is the same, and `.xctestrun` names no device.
  # Its own scheme, so this cannot accidentally pull the unit tests in or push
  # the UI tests into the app scheme that Xcode Cloud runs.
  ui-build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Versions
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: ./ci_scripts/ci_post_clone.sh

      - name: Build the UI tests
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available \
            | awk -F'[()]' '/^ *iPhone/ {print $2; exit}')
          [ -n "$UDID" ] || { echo "no iPhone simulator on this runner" >&2; exit 1; }
          xcodebuild build-for-testing \
            -project PeachOfAWord.xcodeproj \
            -scheme PeachOfAWordUITests \
            -destination "id=$UDID" \
            -disableAutomaticPackageResolution \
            -derivedDataPath "$RUNNER_TEMP/dd"

      # Tarred, because an artifact keeps no file modes: unpacked from a plain
      # upload, the app's executable is no longer executable. About 25 MB.
      - name: Pack the build
        run: tar -C "$RUNNER_TEMP/dd/Build" -czf "$RUNNER_TEMP/ui-test-build.tgz" Products

      - uses: actions/upload-artifact@v7
        with:
          name: ui-test-build
          path: ${{ runner.temp }}/ui-test-build.tgz
          retention-days: 1
          compression-level: 0

  # One shard of the UI tests: its classes from the map, on its own simulator.
  #
  # **Four shards is a measured choice,** not the most the plan allows. Each
  # pays three to five minutes to download, boot and warm before its first
  # test, and the free plan runs five macOS jobs at once across the account.
  # On 29 October 2026, push to every check green took 38.1 minutes with
  # three, 27.9 with four and 35.9 with five: three run too long each, and five
  # with `ui-tests-off-utc` are one job more than the five, so one shard waited
  # 10.7 minutes for a runner. To change it, `plan.py balance N`.
  #
  # `fail-fast: false`, so one shard failing does not cancel the others and
  # their results still say what passed.
  ui-shard:
    needs: [plan, ui-build]
    runs-on: macos-26
    name: ui-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
      CLASSES: ${{ matrix.classes }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ui-test-build
          path: ${{ runner.temp }}

      - name: Unpack the build
        run: |
          mkdir -p "$RUNNER_TEMP/dd/Build"
          tar -C "$RUNNER_TEMP/dd/Build" -xzf "$RUNNER_TEMP/ui-test-build.tgz"

      # Booted, and the app launched once through XCUITest before any counted
      # test: a fresh simulator's first launch has missed XCUITest's 60
      # seconds. `simulator.sh` says why a plain launch was not enough.
      - name: Boot and warm the simulator
        run: .github/ui-tests/simulator.sh "$RUNNER_TEMP/dd/Build/Products"

      - name: UI tests, this shard
        run: |
          set -euo pipefail
          ONLY=()
          for class in $CLASSES; do ONLY+=("-only-testing:PeachOfAWordUITests/$class"); done
          echo "shard $SHARD: $CLASSES"
          XCTESTRUN=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$UDID" \
            "${ONLY[@]}" \
            -resultBundlePath ".build/ui-tests-$SHARD.xcresult"

      # The bundle against the source, test by test: every test this shard's
      # classes declare ran, and nothing else did. A filter that matched
      # nothing would otherwise pass, having run nothing.
      - name: Every test in the shard ran
        if: ${{ !cancelled() }}
        run: |
          python3 .github/ui-tests/plan.py verify "$SHARD" ".build/ui-tests-$SHARD.xcresult" \
            "$CLASSES" --out "$RUNNER_TEMP/ui-test-count-$SHARD.json"

      # The result bundle carries the failure detail and any screenshots, which
      # is most of the value when a UI test fails on a machine you cannot see.
      - name: Keep the result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: .build/ui-tests-${{ matrix.shard }}.xcresult
          retention-days: 7

      - name: Keep the count
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-count-${{ matrix.shard }}
          path: ${{ runner.temp }}/ui-test-count-${{ matrix.shard }}.json
          retention-days: 7

  # The UI tests' one result: green only when every shard ran and passed.
  #
  # **The name is the old job's on purpose.** Reports, prompts and habits say
  # "`ui-tests` is green" and mean the whole UI suite passed; with this, they
  # still do, or, for a data-only change, the targeted set did, which the
  # summary says. On Ubuntu, since it only reads the shards' results.
  ui-tests:
    needs: [plan, ui-build, ui-shard]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        if: needs.ui-shard.result != 'skipped'
        continue-on-error: true
        with:
          pattern: ui-test-count-*
          path: ${{ runner.temp }}/counts
          merge-multiple: true

      - name: Every shard passed, and every test ran
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.ui-build.result }}
          SHARDS: ${{ needs.ui-shard.result }}
          SCOPE: ${{ needs.plan.outputs.scope }}
          WHY: ${{ needs.plan.outputs.why }}
          TESTS: ${{ needs.plan.outputs.tests }}
        run: |
          set -uo pipefail
          echo "plan $PLAN, build $BUILD, shards $SHARDS"
          counted=0
          python3 .github/ui-tests/plan.py summary "$RUNNER_TEMP/counts" \
            > "$RUNNER_TEMP/summary.md" || counted=1
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/summary.md"
          [ "$PLAN" = success ] && [ "$BUILD" = success ] && [ "$SHARDS" = success ] \
            || { echo "a UI test job did not pass" >&2; exit 1; }
          exit "$counted"

  # The UI tests that touch the day, with the simulator in a zone whose date is
  # not UTC's.
  #
  # **Every other job runs in UTC, and in UTC this whole class is invisible.**
  # A day computed from UTC and one computed from the local calendar are the
  # same number there, so a mix of the two passes everywhere above. `dayIndex`
  # is the one place a day is computed and it uses the phone's zone; this is
  # what notices the day that stops being true. Shown red on 2026-09-27 against
  # a planted day index computed from UTC, while the `ui-tests` job stayed green
  # on the same commit.
  #
  # No `swift test` here: no engine test reads the ambient zone, since
  # `dayIndex` takes its zone as an argument, so a shifted `TZ` would test
  # nothing.
  #
  # From the same build as the shards, and run in full for a data-only change
  # too: all three classes read the day, and `ArchiveBeaFirstOpen` the archive.
  ui-tests-off-utc:
    needs: ui-build
    runs-on: macos-26
    env:
      CLASSES: TodayIsTheLocalDate DayRollsOverOnForeground ArchiveBeaFirstOpen

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ui-test-build
          path: ${{ runner.temp }}

      - name: Unpack the build
        run: |
          mkdir -p "$RUNNER_TEMP/dd/Build"
          tar -C "$RUNNER_TEMP/dd/Build" -xzf "$RUNNER_TEMP/ui-test-build.tgz"

      # Twelve hours behind UTC is the previous date until 12:00 UTC; fourteen
      # ahead is the next date from 10:00 UTC. Switching at 11:00 leaves an hour
      # either side, and the check fails the job rather than letting it run
      # blind on the one minute before 00:00 UTC when neither holds.
      - name: Boot and warm the simulator, off UTC
        run: |
          set -euo pipefail
          if [ "$(date -u +%H)" -lt 11 ]; then ZONE=Etc/GMT+12; else ZONE=Pacific/Kiritimati; fi
          echo "UTC $(date -u '+%F %H:%M'), $ZONE $(TZ=$ZONE date '+%F %H:%M')"
          [ "$(date -u +%F)" != "$(TZ=$ZONE date +%F)" ] \
            || { echo "the local date is UTC's; this run would prove nothing" >&2; exit 1; }
          .github/ui-tests/simulator.sh "$RUNNER_TEMP/dd/Build/Products" "$ZONE"

      - name: UI tests that touch the day, off UTC
        run: |
          set -euo pipefail
          ONLY=()
          for class in $CLASSES; do ONLY+=("-only-testing:PeachOfAWordUITests/$class"); done
          XCTESTRUN=$(ls "$RUNNER_TEMP"/dd/Build/Products/*.xctestrun | head -1)
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "id=$UDID" \
            "${ONLY[@]}" \
            -resultBundlePath .build/ui-tests-off-utc.xcresult

      - name: Every test off UTC ran
        if: ${{ !cancelled() }}
        run: python3 .github/ui-tests/plan.py verify off-utc .build/ui-tests-off-utc.xcresult "$CLASSES"

      - name: Keep the result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-off-utc
          path: .build/ui-tests-off-utc.xcresult
          retention-days: 7

  # The same build against an older SDK, and the only thing that can detect the
  # problem it exists for.
  #
  # App/Feel.swift compiled on Xcode 26 and failed on Xcode 16.4, because UIKit's
  # feedback generators changed from @MainActor to nonisolated between the two
  # SDKs. Nothing catches that class of drift by inspection: the API exists in
  # both SDKs, so the deployment-target availability checks pass, no
  # `@available` guard is involved, and grep has nothing to look for. The only
  # detector is a compiler with the older SDK.
  #
  # This matters because the deployment floor is iOS 17. An app that only builds
  # on the newest Xcode has a newest-toolchain requirement whether or not anyone
  # wrote it down, and the failure surfaces when a runner image moves rather
  # than when the mistake is made.
  #
  # A separate job rather than a matrix on `test`, deliberately: a matrix would
  # rename the status check to `test (macos-26)` and silently detach the
  # required check in branch protection.
  #
  # **Skipped for a data-only change, and only when the plan says so.** Nothing
  # such a change touches is compiled, and a skipped job satisfies a required
  # check. If the plan itself fails, its scope is empty rather than `data`, so
  # this still runs: a broken planner cannot pass this check by skipping it.
  build-oldest-sdk:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.scope != 'data' }}
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Versions
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: ./ci_scripts/ci_post_clone.sh

      # No `swift test` here. The engine is SDK independent and running it twice
      # would buy nothing; this job is only asking whether the app compiles.
      - name: Build the app against the older SDK
        run: |
          xcodebuild \
            -project PeachOfAWord.xcodeproj \
            -scheme PeachOfAWord \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -disableAutomaticPackageResolution \
            build
